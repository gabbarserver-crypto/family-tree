name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx vite build && npx cap sync android
      # Release signing is used only when the 4 secrets exist; otherwise a debug-signed APK is produced (installs fine).
      - name: Decode keystore
        if: ${{ env.HAS_KEYSTORE != '' }}
        run: echo "$HAS_KEYSTORE" | base64 -d > android/app/release.keystore
      - name: Build APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$KS_PASS" -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyTree-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
